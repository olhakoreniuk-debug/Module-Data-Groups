<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image carousel</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="slideshow.js"></script>
  </head>
  <body>
    <main class="carousel">
      <h1>Image carousel</h1>

      <img
        id="carousel-img"
        src="./assets/cute-cat-a.png"
        alt="A cute cat"
      />

      <div class="controls" aria-label="Manual slideshow controls">
        <button type="button" id="backward-btn">Backwards</button>
        <button type="button" id="forward-btn">Forward</button>
      </div>

      <div class="controls" aria-label="Automatic slideshow controls">
        <button type="button" id="auto-backward">Auto backwards</button>
        <button type="button" id="stop">Stop</button>
        <button type="button" id="auto-forward">Auto forward</button>
      </div>
    </main>
  </body>
</html>
